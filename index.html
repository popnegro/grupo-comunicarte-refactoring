<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grupo Comunicarte — Coming Soon</title>
  <meta name="description" content="Grupo Comunicarte — Nueva experiencia digital próximamente.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#ffffff">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

  <style>
    :root {
      --green: #01993f;
      --dark: #082028;
      --muted: #66757a;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      background: var(--white);
      color: var(--dark);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }

    .content {
      width: min(760px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 64px;
      display: block;
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--green);
      font-size: 14px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 8vw, 88px);
      line-height: .98;
      font-weight: 800;
      letter-spacing: -.055em;
    }

    .message {
      max-width: 560px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.6;
    }

    .accent {
      width: 64px;
      height: 4px;
      margin-top: 40px;
      background: var(--green);
      border-radius: 999px;
    }

    .footer {
      position: fixed;
      right: 0;
      bottom: 28px;
      left: 0;
      padding: 0 24px;
      color: #8a969a;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 640px) {
      .page { padding: 24px; }
      .logo { margin-bottom: 48px; }
      h1 { font-size: clamp(44px, 15vw, 64px); }
      .message { margin-top: 22px; }
      .accent { margin-top: 32px; }
      .footer { bottom: 20px; }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content" aria-labelledby="page-title">
      <!-- EDITABLE: reemplazá esta ruta por el logo que quieras utilizar -->
      <img
        class="logo"
        src="/assets/brand-dark.svg"
        alt="Grupo Comunicarte"
        width="280"
        height="38"
      >

      <!-- EDITABLE -->
      <p class="eyebrow">Nueva experiencia digital</p>

      <!-- EDITABLE -->
      <h1 id="page-title">COMING SOON</h1>

      <!-- EDITABLE -->
      <p class="message">
        Estamos preparando algo nuevo.<br>
        Muy pronto volvemos a encontrarnos.
      </p>

      <div class="accent" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="footer">
    © Grupo Comunicarte
  </footer>
</body>
</html>
