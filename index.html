  <style>
    :root {
      --background: #082028;
      --green: #01993f;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: var(--background);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .content {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      display: block;
      width: min(280px, 70vw);
      height: auto;
      margin-bottom: 48px;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--green);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.18em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: clamp(48px, 9vw, 96px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.95;
    }

    .message {
      margin: 28px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2.5vw, 21px);
      font-weight: 400;
      line-height: 1.6;
    }

    .accent {
      width: 64px;
      height: 4px;
      margin-top: 36px;
      background: var(--green);
      border-radius: 999px;
    }

    .footer {
      position: fixed;
      right: 24px;
      bottom: 20px;
      left: 24px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      line-height: 1.4;
      text-align: center;
      text-transform: uppercase;
    }

    @media (max-width: 600px) {
      .page {
        padding: 32px 20px;
      }

      .logo {
        width: min(240px, 68vw);
        margin-bottom: 40px;
      }

      h1 {
        font-size: clamp(44px, 14vw, 68px);
      }

      .message {
        margin-top: 24px;
        font-size: 16px;
      }

      .accent {
        margin-top: 30px;
      }

      .footer {
        bottom: 16px;
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="content" aria-labelledby="page-title">
      <img
        class="logo"
        src="/brand/brand-light.svg"
        alt="Grupo Comunicarte"
        width="280"
        height="auto"
      />

      <p class="eyebrow">Nueva experiencia digital</p>

      <h1 id="page-title">COMING SOON</h1>

      <p class="message">
        Estamos preparando algo nuevo.<br />
        Muy pronto volvemos a encontrarnos.
      </p>

      <div class="accent" aria-hidden="true"></div>
    </section>
  </main>

  <footer class="footer">
    GRUPO COMUNICARTE
  </footer>
</body>
</html>
