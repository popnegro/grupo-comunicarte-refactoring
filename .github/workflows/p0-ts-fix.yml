name: P0 TypeScript fix
on:
  push:
    branches:
      - demo/client-preview
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: demo/client-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove unused Media Kit callback
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/map/MediakitPanel.tsx')
          s = p.read_text()
          s = s.replace('  onGoToInventory: () => void;\n', '', 1)
          s = s.replace('export function MediakitPanel({ selectedItems, onClose, onGoToInventory }: MediakitPanelProps)', 'export function MediakitPanel({ selectedItems, onClose }: MediakitPanelProps)', 1)
          p.write_text(s)
          p = Path('src/pages/Inventario.tsx')
          s = p.read_text()
          s = s.replace('            onGoToInventory={() => setIsMediakitOpen(false)}\n', '', 1)
          p.write_text(s)
          PY
      - name: Validate lockfile and typecheck
        run: |
          npm ci
          npm run lint
      - name: Commit fix and remove temporary workflow
        run: |
          rm -f .github/workflows/p0-ts-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/map/MediakitPanel.tsx src/pages/Inventario.tsx .github/workflows/p0-ts-fix.yml
          git diff --cached --check
          git commit -m "fix(ts): remove unused Media Kit callback"
          git push origin HEAD:demo/client-preview
