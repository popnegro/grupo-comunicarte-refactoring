name: Sync npm lockfile
on:
  push:
    branches:
      - demo/client-preview
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: demo/client-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove temporary workflow
        run: |
          rm -f .github/workflows/ci-lock-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json .github/workflows/ci-lock-sync.yml
          git diff --cached --check
          git commit -m "chore(ci): sync npm lockfile" || exit 0
          git push origin HEAD:demo/client-preview
