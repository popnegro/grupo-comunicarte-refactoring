name: Visual QA

on:
  pull_request:
    branches: [main, pmv-production-refinement, 'feat/**']

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual QA · comparación contra rama base
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build candidate
        run: npm run build

      - name: Start candidate preview
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/gc-candidate-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Build trusted baseline from PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_REF"
          git worktree add --detach /tmp/gc-baseline "$BASE_SHA"

          # Run the candidate's screenshot cases against the base-branch application.
          # This generates reference images from the base code, never from the candidate.
          cp tests/visual/inventory.spec.ts /tmp/gc-baseline/tests/visual/inventory.spec.ts
          cp tests/visual/screenshot.css /tmp/gc-baseline/tests/visual/screenshot.css
          cp playwright.config.ts /tmp/gc-baseline/playwright.config.ts
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/gc-baseline/node_modules

          cd /tmp/gc-baseline
          npm run build
          nohup npm run preview -- --host 0.0.0.0 --port 4174 > /tmp/gc-baseline-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null

          VISUAL_BASELINE_MODE=true PLAYWRIGHT_BASE_URL=http://127.0.0.1:4174 npx playwright test \
            -g "desktop mantiene jerarquía|mobile mantiene tarjetas|mapa responsive: marcadores y encuadre|selección cambia el estado visual" \
            --update-snapshots

          test -d tests/visual/__snapshots__/chromium-desktop/inventory.spec.ts
          test -d tests/visual/__snapshots__/chromium-mobile/inventory.spec.ts
          mkdir -p "$GITHUB_WORKSPACE/tests/visual/__snapshots__"
          rm -rf "$GITHUB_WORKSPACE/tests/visual/__snapshots__/chromium-desktop" "$GITHUB_WORKSPACE/tests/visual/__snapshots__/chromium-mobile"
          cp -a tests/visual/__snapshots__/chromium-desktop "$GITHUB_WORKSPACE/tests/visual/__snapshots__/"
          cp -a tests/visual/__snapshots__/chromium-mobile "$GITHUB_WORKSPACE/tests/visual/__snapshots__/"

          {
            echo "## Trusted visual baseline"
            echo "- Base ref: $BASE_REF"
            echo "- Base SHA: $BASE_SHA"
            echo "- Screenshot references were captured from the base-branch application."
            echo "- Candidate screenshots are compared against these references in the next step."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run candidate functional and visual regression tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test

      - name: Upload Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: visual-qa-evidence
          path: |
            playwright-report/
            test-results/visual/
            tests/visual/__snapshots__/
            /tmp/gc-candidate-preview.log
            /tmp/gc-baseline-preview.log
          retention-days: 14
