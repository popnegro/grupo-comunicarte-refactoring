name: Visual QA

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - p0-p1-p2-hardening
      - canonical-refinement

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Vercel deployment for this commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            deployments="$(gh api --header 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments?sha=${EXPECTED_SHA}&per_page=20" 2>/dev/null || printf '[]')"
            deployment_id="$(printf '%s' "$deployments" | jq -r '.[0].id // empty' | head -n1)"
            if [ -n "$deployment_id" ]; then
              statuses="$(gh api --header 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20" 2>/dev/null || printf '[]')"
              url="$(printf '%s' "$statuses" | jq -r '.[] | select(.state == "success" and .target_url != null) | .target_url' | head -n1)"
              if [ -n "$url" ]; then
                echo "VISUAL_QA_URL=$url" >> "$GITHUB_ENV"
                echo "Resolved Vercel deployment: $url"
                exit 0
              fi
            fi
            echo "Waiting for Vercel deployment status for ${EXPECTED_SHA} (${attempt}/36)"
            sleep 10
          done
          echo "Timed out resolving Vercel deployment for ${EXPECTED_SHA}" >&2
          exit 1

      - name: Verify deployment commit
        run: |
          set -euo pipefail
          body="$(curl -fsS "${VISUAL_QA_URL}/api/health")"
          if ! printf '%s' "$body" | grep -q "\"buildSha\":\"${{ github.event.pull_request.head.sha || github.sha }}\""; then
            echo "Resolved deployment does not match expected commit" >&2
            printf '%s\n' "$body"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual QA
        run: npx playwright test tests/visual-qa.spec.ts --config=playwright.visual.config.ts

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
