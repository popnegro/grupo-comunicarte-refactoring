name: Visual QA

on:
  pull_request:
    branches: [main, pmv-production-refinement, 'feat/**']
  push:
    branches: [main, pmv-production-refinement]

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual QA
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # For pull requests, render the trusted base branch first and capture
      # its screenshots using the candidate's visual scenarios. Then compare
      # the candidate build against those base-branch screenshots.
      - name: Checkout trusted base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.base_ref }}
          path: baseline-source

      - name: Install and build trusted base
        if: github.event_name == 'pull_request'
        working-directory: baseline-source
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Start trusted base preview
        if: github.event_name == 'pull_request'
        working-directory: baseline-source
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4174 > /tmp/gc-baseline-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4174/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4174/ >/dev/null

      - name: Capture trusted base screenshots
        if: github.event_name == 'pull_request'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4174
        run: npx playwright test --update-snapshots=all

      - name: Start candidate preview
        run: |
          nohup npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/gc-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null

      - name: Run visual regression against trusted base
        if: github.event_name == 'pull_request'
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test

      - name: Refresh baseline on trusted branch
        if: github.event_name == 'push'
        run: npx playwright test --update-snapshots=all

      - name: Save trusted baseline
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: tests/visual/__snapshots__
          key: visual-baseline-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: visual-qa-report
          path: |
            playwright-report/
            test-results/visual/
            /tmp/gc-preview.log
          retention-days: 14
