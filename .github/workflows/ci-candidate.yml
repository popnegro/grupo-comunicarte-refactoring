name: CI Candidate

on:
  pull_request:
    branches: [main, pmv-validation-candidate]
  push:
    branches:
      - pmv-validation-candidate
      - canonical-candidate
      - canonical-refinement

# This workflow executes pull-request-controlled code. Never grant write access.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Generate semver-compatible audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload audit remediation lockfile
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'audit-remediation:')
        uses: actions/upload-artifact@v4
        with:
          name: audit-remediation-lockfile
          path: package-lock.json
          retention-days: 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
