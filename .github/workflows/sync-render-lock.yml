name: sync-render-lock

on:
  push:
    branches: [fix/render-lockfile-sync]

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only
      - name: Commit synchronized lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/sync-render-lock.yml
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
            exit 0
          fi
          git commit -m "fix: synchronize package lock with Neon driver"
          git push origin HEAD:fix/render-lockfile-sync
